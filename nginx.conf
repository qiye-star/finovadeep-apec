# finova金牛座官网（finovadeep.com）Nginx 配置示例
# 1. 把 release/ 里的压缩包解压到 /srv/finova-website/（解压后应能看到 index.html、404.html、_next/ 等）
# 2. 证书路径按服务器实际情况修改
# 3. nginx -t 检查无误后 nginx -s reload

server {
    listen 80;
    server_name finovadeep.com www.finovadeep.com;
    return 301 https://finovadeep.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name finovadeep.com;

    ssl_certificate     /etc/nginx/ssl/finovadeep.com.pem;   # 按实际修改
    ssl_certificate_key /etc/nginx/ssl/finovadeep.com.key;   # 按实际修改

    root  /srv/finova-website;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 带内容哈希的静态资源长期缓存，页面本身不缓存，更新后立即生效
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # APEC 专题对话服务：/apec-api/ 转发到本机 8840（见 release/APEC专题上线说明.md）
    location /apec-api/ {
        proxy_pass http://127.0.0.1:8840/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # 覆盖而不是追加，限流按真实 IP
        proxy_buffering off;                              # 回答逐字流式输出，必须关缓冲
        proxy_cache off;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }

    error_page 404 /404.html;
}

# www 暂时跳转到不带 www 的官网。
# 注意：finova-0.1 的部署文档计划把网页版放在 www，两者的域名分工定下来后再改这里。
server {
    listen 443 ssl;
    http2 on;
    server_name www.finovadeep.com;
    ssl_certificate     /etc/nginx/ssl/finovadeep.com.pem;
    ssl_certificate_key /etc/nginx/ssl/finovadeep.com.key;
    return 301 https://finovadeep.com$request_uri;
}
