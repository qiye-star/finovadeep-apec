# 加到 finovadeep.com 的 443 server 块里（与 location / 并列）
# 页面请求 https://finovadeep.com/apec-api/chat → 本机 127.0.0.1:8840/chat
location /apec-api/ {
    proxy_pass http://127.0.0.1:8840/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 覆盖（不是追加）客户端 IP，限流按真实 IP 计算，用户无法伪造
    proxy_set_header X-Forwarded-For $remote_addr;
    # 回答是逐字流式输出，必须关掉缓冲
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
    client_max_body_size 64k;
}
